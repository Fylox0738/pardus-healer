name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sözdizimi denetimi (tüm modüller)
        run: python3 -m compileall -q pardus_healer pardus_doctor tests healer_rescue.py run.py main.py main_doctor.py

      - name: Birim testleri (stdlib-only, 3. parti bağımlılık yok)
        run: python3 -m unittest discover -s tests -v

      - name: CLI smoke test (tanı motoru uçtan uca)
        run: |
          # --cli bilinçli olarak anlamlı çıkış kodu döndürür:
          # 0=temiz · 1=uyarı var · 2=sorun bulundu. CI runner'ında bazı
          # kontrollerin FAIL vermesi BEKLENEN durumdur, bu bir CI hatası
          # değildir. Çıkış kodu "|| code=$?" ile yakalanmalı — komut
          # doğrudan bırakılırsa Actions'ın `bash -e` kabuğu adımı daha ilk
          # satırda düşürür (kod hiç okunamaz).
          code=0
          python3 run.py --cli --no-color || code=$?
          echo "CLI çıkış kodu: $code (0=temiz · 1=uyarı · 2=sorun)"
          if [ "$code" -gt 2 ]; then
            echo "HATA: Tanı motoru çöktü ya da beklenmeyen çıkış kodu döndü."
            exit 1
          fi

      - name: Rapor üretimi (HTML + JSON)
        run: |
          code=0
          python3 run.py --cli --quiet --html /tmp/rapor.html --json /tmp/rapor.json || code=$?
          if [ "$code" -gt 2 ]; then
            echo "HATA: Rapor üretimi sırasında motor çöktü (çıkış kodu: $code)."
            exit 1
          fi
          test -s /tmp/rapor.html || { echo "HATA: HTML rapor üretilmedi/boş."; exit 1; }
          test -s /tmp/rapor.json || { echo "HATA: JSON rapor üretilmedi/boş."; exit 1; }
          python3 -c "import json; json.load(open('/tmp/rapor.json')); print('JSON rapor geçerli.')"
          echo "HTML ve JSON raporları başarıyla üretildi."
